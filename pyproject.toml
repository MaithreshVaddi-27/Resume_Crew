[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-crew"
version = "1.4.0"
description = "Resume Crew — grounded, local-first resume-to-job-description analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "crewai[google-genai]==1.15.11",
  "pypdf==6.14.2",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "gradio>=4.44.0",
  "matplotlib>=3.8.0",
  "fpdf2>=2.8.0",
  "pyngrok>=7.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.9.0",
  "mypy==1.13.0",
]

[project.scripts]
resume-crew = "resume_crew.cli:main"
resume-crew-ui = "resume_crew.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"resume_crew.prompts" = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "PLE", "PERF", "S", "TID", "PGH"]
ignore = ["E501", "B008", "S101", "S105", "TRY003", "TRY301", "BLE001"]
fixable = ["F", "I", "B", "C4", "UP", "PLE", "PERF", "TID", "PGH"]
unfixable = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["frozenset"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true
ignore_missing_imports = true
